[package]
name = "zync"
version = "0.1.0"
edition = "2021"
description = "Settings Sync for Zed — same idea as VS Code Settings Sync"
license = "MIT"
readme = "README.md"

[[bin]]
name = "zync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
